<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigurumis YENI - Inicio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Amigurumis YENI</h1>
    </header>
    <main class="hero-section">
        <div class="tarjeta-hero">
            <h1>Magia tejida a mano, sólo para ti.</h1>
            <p>En Amigurumis YENI, nuestro objetivo es llenar tu mundo de ternura y creatividad. Descubre la magia de los amigurumis en nuestra tienda.</p>
        </div>
    </main>
    <!-- Use el carrusel de imagenes Multiple items - Three at a time de bootstrap :P -->
    <div>
        <div id="carouselMultiple" class="carousel slide" data-bs-ends="stop" style="--bs-carousel-items: 3; --bs-carousel-items-gap: 1rem;">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Destacados</h5>
                <div>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="prev" style="--bs-carousel-control-icon-width: 1rem;">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="next" style="--bs-carousel-control-icon-width: 1rem;">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active"><img src="gato 1.jpg" class="d-block w-100 rounded-5" alt="gato 1"></div>
                <div class="carousel-item"><img src="gato 2.jpg" class="d-block w-100 rounded-5" alt="gato 2"></div>
                <div class="carousel-item"><img src="gato 3.jpg" class="d-block w-100 rounded-5" alt="gato 3"></div>
                <div class="carousel-item"><img src="pollito.jpg" class="d-block w-100 rounded-5" alt="pollito"></div>
                <div class="carousel-item"><img src="florero.jpg" class="d-block w-100 rounded-5" alt="florero"></div>
                <div class="carousel-item"><img src="conejita.jpg" class="d-block w-100 rounded-5" alt="conejita"></div>
                <div class="carousel-item"><img src="ballenitas.jpg" class="d-block w-100 rounded-5" alt="ballenitas"></div>
            </div>
        </div>
    </div>
    <footer>
        <p>2026 Amigurumis YENI. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
