<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigurumis YENI - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="hero-section">
        <div class="tarjeta-hero">
            <h1>Magia tejida a mano, sólo para ti. :3</h1>
            <p>En Amigurumis YENI, nuestro objetivo es llenar tu mundo de ternura y creatividad. Descubre la magia de los amigurumis en nuestra tienda.</p>
        </div>
    </main>
    <section class="container my-5">
        <div id="carouselMultiple" class="carousel slide" data-bs-ride="carousel" style="--bs-carousel-items: 3; --bs-carousel-items-gap: 1rem;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0" style="color: #1a1a1a; font-weight: 500;">Nuestros Destacados</h3>
                <div>
                    <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Siguiente</span>
                    </button>
                </div>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="gato 1.jpg" class="d-block w-100 rounded-4" alt="gatito 1" style="height: 250px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="gato 2.jpg" class="d-block w-100 rounded-4" alt="gatito 2" style="height: 250px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="gato 3.jpg" class="d-block w-100 rounded-4" alt="gatito 3" style="height: 250px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="pollito.jpg" class="d-block w-100 rounded-4" alt="pollito" style="height: 250px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="florero.jpg" class="d-block w-100 rounded-4" alt="florero" style="height: 250px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="conejita.jpg" class="d-block w-100 rounded-4" alt="conejita" style="height: 250px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="ballenitas.jpg" class="d-block w-100 rounded-4" alt="ballenitas" style="height: 250px; object-fit: cover;">
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
